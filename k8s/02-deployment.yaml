apiVersion: apps/v1
kind: Deployment
metadata:
  name: age-calculator-deployment
  namespace: age-calculator
  labels:
    app.kubernetes.io/name: age-calculator
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: age-calculator-system
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: age-calculator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: age-calculator
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: age-calculator-system
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/health"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 30
      # Spreads pods evenly across Availability Zones and Nodes in Huawei CCE
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: age-calculator
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: age-calculator
      # Huawei CCE clusters inject default-secret for SWR access
      imagePullSecrets:
        - name: default-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: age-calculator
          image: swr.ap-southeast-3.myhuaweicloud.com/devsecops-org/age-calculator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: age-calculator-config
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          # Startup probe allows Spring Boot & JVM initialization time
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          # Liveness probe checks for deadlocks / container failure
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness probe ensures traffic is routed only when ready
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
