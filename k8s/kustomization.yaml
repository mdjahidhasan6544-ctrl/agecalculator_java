apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: age-calculator

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 02-deployment.yaml
  - 03-service.yaml
  - 03-service-elb.yaml
  - 04-ingress.yaml
  - 05-hpa.yaml
  - 06-pdb.yaml

# SWR Image configuration - can be overridden during CI/CD with:
# kustomize edit set image swr.ap-southeast-3.myhuaweicloud.com/devsecops-org/age-calculator=swr.<REGION>.myhuaweicloud.com/<ORG>/age-calculator:${BUILD_NUMBER}
images:
  - name: swr.ap-southeast-3.myhuaweicloud.com/devsecops-org/age-calculator
    newName: swr.ap-southeast-3.myhuaweicloud.com/devsecops-org/age-calculator
    newTag: latest
